name: Build PowerDNS integration
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  recursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        # 3.10 is the documented minimum; its asyncio.TimeoutError differs from the builtin.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Recursor and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pdns-recursor
          pip install -r requirements.txt pytest
      - name: Run bridge and live Recursor tests
        run: |
          command -v pdns_recursor
          pdns_recursor --version
          python -m pytest -q tests/test_powerdns.py

  package:
    needs: recursor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Package Lua hook and Python bridge
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/package.py
      - name: Upload installation bundle and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blockinator-powerdns
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: blockinator-powerdns
          path: dist
      - name: Attach package to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

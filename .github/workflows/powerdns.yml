name: PowerDNS integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recursor:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.10 is the documented minimum; its asyncio.TimeoutError differs from the builtin.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Recursor and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pdns-recursor
          pip install -r requirements.txt pytest
      - name: Run bridge and live Recursor tests
        run: python -m pytest -q tests/test_powerdns.py

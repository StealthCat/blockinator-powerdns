name: Build PowerDNS integration
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  recursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        # 3.10 is the documented minimum; its asyncio.TimeoutError differs from the builtin.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Recursor and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pdns-recursor
          pip install -r requirements.txt pytest
      - name: Run bridge and live Recursor tests
        run: |
          command -v pdns_recursor
          pdns_recursor --version
          python -m pytest -q tests/test_powerdns.py

  package:
    needs: recursor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Package Lua hook and Python bridge
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/package.py
      - name: Upload installation bundle and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blockinator-powerdns
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blockinator-powerdns
          path: dist
      - name: Attach package to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
